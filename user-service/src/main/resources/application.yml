
  spring:
    application:
      name: user-service

    datasource:
      url: jdbc:postgresql://localhost:5432/user_db
      username: postgres
      password: root
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      open-in-view: false
      show-sql: true

    sql:
      init:
        mode: never

  server:
    port: 8082

  management:
    endpoints:
      web:
        exposure:
          include: health,info

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/

