spring:
  application:
    name: catalog-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DATABASE_USERNAME:commerce}
    password: ${DATABASE_PASSWORD:commerce123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8081