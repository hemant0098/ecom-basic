name: build-test-push
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Build and test
        run: mvn --batch-mode verify
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}', aws-region: '${{ vars.AWS_REGION }}' }
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: docker build --build-arg MODULE=api-gateway -t ${{ secrets.ECR_REGISTRY }}/commerce-api:${{ github.sha }} . && docker push ${{ secrets.ECR_REGISTRY }}/commerce-api:${{ github.sha }}
      - name: Deploy ECS revision
        run: aws ecs update-service --cluster ${{ vars.ECS_CLUSTER }} --service ${{ vars.ECS_SERVICE }} --force-new-deployment
