services:
  config-server:
    build: { context: ., args: { MODULE: config-server } }
    ports: ["8888:8888"]
  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    ports: ["8761:8761"]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  user-service:
    build: { context: ., args: { MODULE: user-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka/ }
    depends_on: [discovery-server]
  product-service:
    build: { context: ., args: { MODULE: product-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka/, DATABASE_URL: jdbc:postgresql://postgres:5432/product_db }
    depends_on: [postgres, discovery-server]
  payment-service:
    build: { context: ., args: { MODULE: payment-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka/ }
    depends_on: [discovery-server]
  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka/, KAFKA_BOOTSTRAP_SERVERS: kafka:9092 }
    depends_on: [kafka, discovery-server]
  api-gateway:
    environment: { EUREKA_URL: http://discovery-server:8761/eureka/ }
    depends_on: [discovery-server, product-service, order-service]
