apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecom-jenkins
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:    
      containers:
        - name: ecom-product-service
          image: hemantdevgan/product-service:v1.5
          ports:
          - containerPort: 8083
          env:
          - name: DATABASE_URL
            value: "jdbc:postgresql://ecom-service:5432/product_db"
          - name: DATABASE_USERNAME
            value: "postgres" 
          - name: DATABASE_PASSWORD
            value: "root" 
          - name: EUREKA_URL
            value: "http://discovery-server:8761/eureka/"