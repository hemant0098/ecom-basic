apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecom-jenkins
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    spec:
      labels:
        app: notification-service
      containers:
        - name: ecom-notification-service
          image: hemantdevgan/notification-service:v1
          ports:
            - name: notification-service
              containerPort: 8085
          env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            value: "ecom-kafka:9092"
          - name: EUREKA_URL
            value: "http://ecom-euraka:8761/eureka/" 