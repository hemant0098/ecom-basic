apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecom-jenkins
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: ecom-notification-service
          image: hemantdevgan/notification-service:v1.5
          ports:
          - containerPort: 8085
          env:
          - name: KAFKA_BOOTSTRAP_SERVERS
            value: "ecom-kafka:9092"
          - name: EUREKA_URL
            value: "http://discovery-server:8761/eureka/" 