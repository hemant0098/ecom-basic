apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecom-jenkins
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:    
      containers:
        - name: ecom-user-service
          image: hemantdevgan/user-service:v1.5
          ports:
          - containerPort: 8082
          env:
          - name: DATABASE_URL
            value: "jdbc:postgresql://ecom-service:5432/user_db"
          - name: DATABASE_USERNAME
            value: "postgres" 
          - name: DATABASE_PASSWORD
            value: "root" 
          - name: EUREKA_URL
            value: "http://discovery-server:8761/eureka/"