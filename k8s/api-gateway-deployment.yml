
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-api-gateway
  namespace: ecom-jenkins
  labels:
    app: ecom-api-gateway

spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecom-api-gateway

  template:
    metadata:
      labels:
        app: ecom-api-gateway
    spec:
      containers:
        - name: ecom-api-gateway
          image: hemantdevgan/api-gateway:v1.5
          ports:
          - containerPort: 8087
          env:
            - name: EUREKA_URL
              value: "http://discovery-server:8761/eureka/"
